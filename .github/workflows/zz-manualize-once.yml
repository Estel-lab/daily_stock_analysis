name: Manualize workflows once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-manualize-once.yml'

permissions:
  contents: write

jobs:
  manualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Convert all disabled workflows to manual-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src_dir = Path('.github/workflows-disabled')
          dst_dir = Path('.github/workflows')
          dst_dir.mkdir(parents=True, exist_ok=True)
          def manualize(text: str) -> str:
              lines = text.splitlines(keepends=True)
              on_start = next(i for i,l in enumerate(lines) if re.match(r'^on:\s*$', l.rstrip('\r\n')))
              on_end = len(lines)
              for j in range(on_start+1, len(lines)):
                  raw = lines[j].rstrip('\r\n')
                  if raw and not raw.startswith((' ', '\t', '#')):
                      on_end = j
                      break
              block = lines[on_start+1:on_end]
              wd_start = next((k for k,l in enumerate(block) if re.match(r'^  workflow_dispatch:\s*$', l.rstrip('\r\n'))), None)
              if wd_start is None:
                  wd = ['  workflow_dispatch:\n']
              else:
                  wd_end = len(block)
                  for k in range(wd_start+1, len(block)):
                      raw = block[k].rstrip('\r\n')
                      if re.match(r'^  [A-Za-z0-9_-]+:\s*', raw):
                          wd_end = k
                          break
                  wd = block[wd_start:wd_end]
              return ''.join(lines[:on_start] + ['on:\n','  # Automatic triggers disabled; manual runs only.\n'] + wd + ['\n'] + lines[on_end:])
          files = sorted(list(src_dir.glob('*.yml')) + list(src_dir.glob('*.yaml')))
          if not files:
              raise SystemExit('No disabled workflows found')
          for src in files:
              (dst_dir/src.name).write_text(manualize(src.read_text(encoding='utf-8')), encoding='utf-8')
              src.unlink()
          try:
              src_dir.rmdir()
          except OSError:
              pass
          Path('.github/workflows/zz-manualize-once.yml').unlink(missing_ok=True)
          PY
      - name: Commit manual-only workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          git commit -m "chore: keep GitHub Actions manual-only"
          git push origin HEAD:main
